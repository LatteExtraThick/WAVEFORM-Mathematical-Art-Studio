name: Build and publish WAVEFORM for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build Windows application
        run: pyinstaller --noconfirm --clean WAVEFORM.spec

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/WAVEFORM/*" -DestinationPath "dist/WAVEFORM_Portable_x64.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Create Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "installer/Output" | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer/WAVEFORM.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Upload build files for manual runs
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: actions/upload-artifact@v4
        with:
          name: WAVEFORM-Windows-Build
          path: |
            dist/WAVEFORM_Portable_x64.zip
            installer/Output/WAVEFORM_Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: WAVEFORM release
          generate_release_notes: true
          files: |
            dist/WAVEFORM_Portable_x64.zip
            installer/Output/WAVEFORM_Setup.exe
